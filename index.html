
<html lang="pt">

<head>

    <!-- Configuração de caracteres -->
    <meta charset="UTF-8">

    <!-- Faz o site funcionar corretamente no telemóvel -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Nome que aparece na aba do navegador -->
    <title>Gabriel Fusari | Portfólio</title>

    <!-- Importação da fonte moderna Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>

        /* Reset básico do site */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Corpo principal da página */
        body {

            /* Cor de fundo preta */
            background: #0a0a0a;

            /* Fonte do site */
            font-family: 'Poppins', sans-serif;

            /* Cor padrão do texto */
            color: white;

            /* Centraliza tudo */
            display: flex;
            justify-content: center;
            align-items: center;

            /* Altura mínima da tela */
            min-height: 100vh;

            /* Espaçamento lateral */
            padding: 20px;
        }

        /* Card principal */
        .card {

            /* Largura máxima para mobile */
            width: 100%;
            max-width: 420px;

            /* Fundo do card */
            background: #111111;

            /* Bordas arredondadas */
            border-radius: 24px;

            /* Espaçamento interno */
            padding: 35px 25px;

            /* Centraliza textos */
            text-align: center;

            /* Borda dourada suave */
            border: 1px solid rgba(212,175,55,0.15);

            /* Sombra elegante */
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);

            /* Animação ao abrir */
            animation: fadeIn 1s ease;
        }

        /* Foto de perfil */
        .profile-img {

            /* Tamanho da imagem */
            width: 115px;
            height: 115px;

            /* Faz a imagem virar círculo */
            border-radius: 50%;

            /* Ajusta imagem sem deformar */
            object-fit: cover;

            /* Borda dourada */
            border: 3px solid #d4af37;

            /* Espaço abaixo da foto */
            margin-bottom: 20px;
        }

        /* Nome principal */
        h1 {

            font-size: 28px;
            font-weight: 600;

            margin-bottom: 8px;

            letter-spacing: 1px;
        }

        /* Texto abaixo do nome */
        p {

            color: #b3b3b3;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 28px;
        }

        /* Estilo padrão dos botões */
        .btn {

            display: block;

            width: 100%;

            padding: 15px;

            margin-bottom: 15px;

            border-radius: 14px;

            text-decoration: none;

            font-weight: 500;

            font-size: 15px;

            background: #1a1a1a;

            color: #d4af37;

            border: 1px solid rgba(212,175,55,0.2);

            transition: all 0.3s ease;
        }

        /* Efeito quando passa o rato em cima */
        .btn:hover {

            background: #d4af37;

            color: black;

            transform: translateY(-2px);

            box-shadow: 0 5px 20px rgba(212,175,55,0.3);
        }

        /* Rodapé */
        .footer {

            margin-top: 25px;

            font-size: 12px;

            color: #666;
        }

        /* Animação do card aparecendo */
        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

    </style>

</head>

<body>

    <!-- Card principal do portfólio -->
    <div class="card">

        <!-- Foto de perfil -->
        <img class="profile-img"
        src="https://via.placeholder.com/150"
        alt="Foto de perfil">

        <!-- Seu nome -->
        <h1>Gabriel Fusari</h1>

        <!-- Pequena descrição -->
        <p>
            Desenvolvedor e criador digital focado em experiências modernas,
            elegantes e funcionais.
        </p>

        <!-- Botão Instagram -->
        <a class="btn"
        href="https://www.instagram.com/gabriel_fusari_"
        target="_blank">

            Ver Instagram →

        </a>

        <!-- Botão Email -->
        <a class="btn"
        href="mailto:gabrielfuzaript@gmail.com">

            Enviar Email →

        </a>

        <!-- Botão Telefone -->
        <a class="btn"
        href="tel:+351936709745">

            Entrar em Contato →

        </a>

        <!-- Rodapé -->
        <div class="footer">

            © Gabriel Fusari

        </div>

    </div>

</body>

</html>
