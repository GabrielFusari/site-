<!DOCTYPE html>
<html lang="pt">

<head>

    <!-- CONFIGURAÇÕES -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- TÍTULO -->
    <title>Gabriel Fusari | Full Stack Developer</title>

    <!-- FONTE -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- ÍCONES -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        /* RESET */

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        /* BODY */

        body{

            font-family:'Poppins', sans-serif;

            background:
            linear-gradient(
            180deg,
            #0a0a0a 0%,
            #050505 100%
            );

            color:white;

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            padding:24px;
        }

        /* CARD */

        .card{

            width:100%;
            max-width:430px;

            background:#111111;

            border:1px solid rgba(255,255,255,0.05);

            border-radius:28px;

            padding:42px 30px;

            text-align:center;

            box-shadow:
            0 10px 40px rgba(0,0,0,0.6);

            animation:fadeUp 1s ease;
        }

        /* FOTO */

        .profile-wrapper{

            width:125px;
            height:125px;

            margin:auto;
            margin-bottom:24px;

            border-radius:50%;

            padding:4px;

            background:
            linear-gradient(
            135deg,
            #d4af37,
            #8b5cf6
            );

            box-shadow:
            0 0 30px rgba(212,175,55,0.15);
        }

        .profile-img{

            width:100%;
            height:100%;

            object-fit:cover;

            border-radius:50%;

            border:3px solid #111;
        }

        /* NOME */

        h1{

            font-size:34px;

            font-weight:700;

            margin-bottom:10px;

            letter-spacing:0.5px;
        }

        /* CARGO */

        .role{

            color:#d4af37;

            font-size:12px;

            font-weight:600;

            letter-spacing:3px;

            text-transform:uppercase;

            margin-bottom:20px;
        }

        /* DESCRIÇÃO */

        .description{

            color:#a8a8a8;

            font-size:14px;

            line-height:1.9;

            max-width:320px;

            margin:auto;

            margin-bottom:30px;
        }

        /* STACK */

        .stack{

            display:flex;

            justify-content:center;

            flex-wrap:wrap;

            gap:10px;

            margin-bottom:34px;
        }

        .tag{

            padding:9px 15px;

            border-radius:30px;

            background:#171717;

            border:1px solid rgba(255,255,255,0.05);

            color:#d4af37;

            font-size:12px;

            transition:0.35s cubic-bezier(.16,1,.3,1);
        }

        .tag:hover{

            transform:translateY(-2px);

            background:#1d1d1d;
        }

        /* BOTÕES */

        .btn{

            display:flex;

            align-items:center;

            justify-content:center;

            gap:12px;

            width:100%;

            padding:16px;

            margin-bottom:15px;

            border-radius:16px;

            text-decoration:none;

            background:#181818;

            border:1px solid rgba(255,255,255,0.05);

            color:white;

            font-size:15px;

            font-weight:500;

            transition:
            all 0.4s cubic-bezier(.16,1,.3,1);
        }

        .btn i{

            color:#d4af37;

            font-size:16px;

            transition:0.3s;
        }

        /* HOVER PREMIUM */

        .btn:hover{

            transform:translateY(-2px);

            background:#d4af37;

            color:black;

            box-shadow:
            0 8px 25px rgba(212,175,55,0.18);
        }

        .btn:hover i{

            color:black;
        }

        /* ESTATÍSTICAS */

        .stats{

            display:flex;

            justify-content:space-between;

            margin-top:28px;

            padding-top:24px;

            border-top:1px solid rgba(255,255,255,0.05);
        }

        .stat h3{

            color:#d4af37;

            font-size:20px;

            margin-bottom:4px;
        }

        .stat p{

            color:#777;

            font-size:11px;
        }

        /* FOOTER */

        .footer{

            margin-top:28px;

            font-size:12px;

            color:#666;
        }

        /* ANIMAÇÃO */

        @keyframes fadeUp{

            from{

                opacity:0;
                transform:translateY(25px);
            }

            to{

                opacity:1;
                transform:translateY(0);
            }
        }

    </style>

</head>

<body>

    <!-- CARD -->

    <div class="card">

        <!-- FOTO -->

        <div class="profile-wrapper">

            <img
            class="profile-img"
            src="./foto.jpeg"
            alt="Gabriel Fusari">

        </div>

        <!-- NOME -->

        <h1>Gabriel Fusari</h1>

        <!-- CARGO -->

        <div class="role">

            Full Stack Developer

        </div>

        <!-- DESCRIÇÃO -->

        <div class="description">

            Desenvolvedor Full Stack focado em
            interfaces modernas, automações
            e soluções web escaláveis.

        </div>

        <!-- STACK -->

        <div class="stack">

            <div class="tag">JavaScript</div>

            <div class="tag">Python</div>

            <div class="tag">React</div>

            <div class="tag">SQL</div>

            <div class="tag">UI/UX</div>

            <div class="tag">APIs</div>

        </div>

        <!-- INSTAGRAM -->

        <a
        class="btn"
        href="https://instagram.com/gabriel_fusari_"
        target="_blank">

            <i class="fa-brands fa-instagram"></i>

            Instagram

        </a>

        <!-- EMAIL -->

        <a
        class="btn"
        href="mailto:gabrielfuzaript@gmail.com">

            <i class="fa-solid fa-envelope"></i>

            Email

        </a>

        <!-- WHATSAPP -->

        <a
        class="btn"
        href="https://wa.me/351936709745"
        target="_blank">

            <i class="fa-brands fa-whatsapp"></i>

            WhatsApp

        </a>

        <!-- GITHUB -->

        <a
        class="btn"
        href="https://github.com/"
        target="_blank">

            <i class="fa-brands fa-github"></i>

            GitHub

        </a>

        <!-- ESTATÍSTICAS -->

        <div class="stats">

            <div class="stat">

                <h3>20+</h3>

                <p>Projetos</p>

            </div>

            <div class="stat">

                <h3>3+</h3>

                <p>Tecnologias</p>

            </div>

            <div class="stat">

                <h3>100%</h3>

                <p>Responsivo</p>

            </div>

        </div>

        <!-- FOOTER -->

        <div class="footer">

            © 2026 Gabriel Fusari — All Rights Reserved

        </div>

    </div>

</body>

</html>
