<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabriel Fusari | Portfólio</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b1220;
            color: white;
            display: flex;
            justify-content: center;
            padding: 20px;
            }

        .card {
            width: 100%;
            max-width: 420px;
            text-align: center;
            background: #111a2e;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
             }

        .profile-img 
              {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #3b82f6;
              }

        h1 
            {
            margin: 15px 0 5px;
            font-size: 22px;
            }

        p  
            {
            color: #aab4d0;
            font-size: 14px;
            margin-bottom: 20px;
           }

        .btn 
            {
            display: block;
            padding: 14px;
            margin: 12px 0;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            transition: 0.2s;
            }

        .btn:hover {
            transform: scale(1.03);
        }

        .instagram {
            background: #E1306C;
            color: white;
        }

        .email {
            background: #2563eb;
            color: white;
        }

        .phone {
            background: #22c55e;
            color: white;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #6b7280;
        }
    </style>
</head>

<body>

    <div class="card">

        <img class="profile-img" src="https://via.placeholder.com/150" alt="Foto de perfil">

        <h1>Gabriel Fusari</h1>
        <p>Desenvolvedor | Criador de conteúdo | Portfólio pessoal</p>

        <a class="btn instagram" href="https://instagram.com/gabriel_fusari" target="_blank">
            📸 Instagram
        </a>

        <a class="btn email" href="mailto:gabrielfuzaript@email.com">
            📧 Enviar Email
        </a>

        <a class="btn phone" href="tel:+351 936 709 745 ">
            📱 Ligar
        </a>

        <div class="footer">
            Feito com HTML + CSS 💻
        </div>

    </div>

</body>
</html>
